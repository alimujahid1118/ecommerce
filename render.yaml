# Render Blueprint: deploys the standalone chat service from this monorepo.
# In Render: New → Blueprint → select this repo. Render reads this file,
# creates the web service, and prompts for the three env values below
# (sync: false means "ask in the dashboard, never store in the repo").
services:
  - type: web
    name: chat-service
    runtime: node
    rootDir: chat-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
